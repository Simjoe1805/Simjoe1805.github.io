<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Johannes W. Simanjuntak Crest</title>
  <desc id="desc">A shield crest featuring the initials JWS.</desc>
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#e4d7c8"/>
    </linearGradient>
    <linearGradient id="ringFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bca891"/>
      <stop offset="100%" stop-color="#8f7760"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="108" fill="#f7f1e8"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ringFill)" stroke-width="5"/>

  <path d="M120 42 L188 66 L182 137 C176 174 152 202 120 216 C88 202 64 174 58 137 L52 66 Z"
