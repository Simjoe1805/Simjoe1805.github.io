  <text x="120" y="137"
        text-anchor="middle"
        font-family="'Spectral', Georgia, serif"
        font-size="52"
        font-weight="700"
        fill="#2f2a26">JWS</text>

  <circle cx="120" cy="94" r="4.5" fill="#8f7760"/>
</svg>
